<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cores com a Betina</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>🌈 Cores com a Betina</h1>
        <p>
          Um app divertido para aprender cores. Comece pelas
          <strong>cores principais</strong> e depois explore a paleta completa.
        </p>
      </header>

      <section class="game" aria-label="Jogo das cores principais">
        <h2>🎯 Toque na cor pedida</h2>
        <p id="target-text" class="target-text">Carregando...</p>
        <div class="cards" id="main-cards" role="group" aria-label="Cores principais"></div>

        <div class="actions">
          <button id="new-round" class="btn">Nova rodada</button>
          <button id="speak-color" class="btn btn-secondary">Ouvir a cor</button>
        </div>

        <p id="feedback" class="feedback" aria-live="polite"></p>
      </section>

      <section class="palette" aria-label="Paleta completa de cores">
        <h2>✨ Mais cores para explorar</h2>
        <div class="cards" id="all-cards" role="group" aria-label="Todas as cores"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
